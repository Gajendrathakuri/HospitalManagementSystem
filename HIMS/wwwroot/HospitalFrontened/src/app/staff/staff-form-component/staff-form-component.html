<div class="container mt-4">
  <div class=" ">
    <div class="">
      <form [formGroup]="staffForm">
        <div class="row d-flex justify-content-evenly">
          <div class="col-4">
            <!-- Name -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" formControlName="name" name="name" />
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" formControlName="address" name="address" />
            </div>

            <!-- City -->
            <div class="mb-3">
              <label class="form-label">City</label>
              <input type="text" class="form-control" formControlName="city" name="city" />
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label">Phone No</label>
              <input type="text" class="form-control"  name="phoneNo" />
            </div>
            <!-- Salary -->
            <div class="mb-3">
              <label class="form-label">Salary</label>
              <input type="number" class="form-control" formControlName="dateOfBirth" name="salary" />
            </div>
          </div>
          <div class="col-4">
            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" name="email" />
            </div>

            <!-- Gender -->
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select" name="gender" formControlName="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Profile -->
            <div class="mb-3">
              <label class="form-label">Staff Role</label>
              <select class="form-select" name="profile" formControlName="profile">
                <option value=""> select </option>
              </select>
            </div>

            <!-- Department -->
            <div class="mb-3">
              <label class="form-label">Department</label>
              <select class="form-select" name="departmentId">
                <option value="">Select Department</option>
                <!-- Load dynamically from API -->
              </select>
            </div>

            <!-- Joined Date -->
            <div class="mb-3">
              <label class="form-label">Joined Date</label>
              <input type="date" class="form-control" name="joinedDate" />
            </div>
            <div class="row ">
              <button class="btn w-25 btn-primary" (click)="submit()">Create Staff</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
