<div class="container">
  <div class="row justify-content-end">
    <button class="btn w-25 btn-primary" (click)="modelOpen()">
      <i class="bi bi-person-plus me-2"></i>
      Add New Staff
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal fade container w-100" id="staffModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Staff</h5>

        <!-- Close Button -->
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-staff-form-component (staffCreated)="updatehandler($event)"></app-staff-form-component>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary">Create Staff</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
