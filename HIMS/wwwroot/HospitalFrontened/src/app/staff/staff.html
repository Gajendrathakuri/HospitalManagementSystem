<div class="container">
  <div class="row justify-content-end">
    <button class="btn w-25 btn-primary" (click)="modelOpen()">
      <i class="bi bi-person-plus me-2"></i>
      Add New Staff
    </button>
  </div>
</div>

<app-tablecomponent [columns]="cols" [data]="AllStaffs"> </app-tablecomponent>
<router-outlet></router-outlet>
<!-- Modal -->
<div class="modal fade container-fluid w-100" id="staffModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Staff</h5>

        <!-- Close Button -->
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-staff-form-component (staffCreated)="updatehandler($event)"></app-staff-form-component>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>





 
<!-- Confirm Delete Modal -->
<div
  class="modal fade"
  id="staffDelete"
  tabindex="-1"
  aria-labelledby="confirmDeleteLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-sm">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="confirmDeleteLabel">Confirm Delete</h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body text-center py-4">
        <p class="mb-4 fs-6">Are you sure you want to delete this Staff</p>
        <div class="d-flex justify-content-center gap-3">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
          <button type="button" class="btn btn-danger" (click)="deletepatientswith()">Yes</button>
        </div>
      </div>
    </div>
  </div>
</div>




<!-- view staff Moals -->

<!-- Modal -->
<div class="modal fade container-fluid w-100" id="viewStaffModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <!-- Close Button -->
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-staff-detail  [staff]="SelectedStaff"></app-staff-detail>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
