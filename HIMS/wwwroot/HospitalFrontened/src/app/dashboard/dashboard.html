<div class="container mt-4">
  <h3 class="text-center mb-4">Admin Dashboard</h3>

  <div class="row text-center g-3">
    <!-- Cards for counts -->
    <div class="col-md-3">
      <div class="card shadow-sm p-3">
        <img src="../../assets/images/appointment.png" alt="">
        <h5>Appointments</h5>
        <h2>{{ totalAppointments$ | async }}</h2>
        <button class="btn btn-primary mt-2" (click)="goToAppointments()">View</button>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm p-3">
        <img src="../../assets/images/hospitalisation.png" alt="">
        <h5>Patients</h5>
        <h2>{{ totalPatients$ | async}}</h2>
        <button class="btn btn-primary mt-2" (click)="goToPatients()">Register</button>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm p-3">
<img src="../../assets/images/doctor.png"  alt="">

         <h5>Doctor</h5>
        <h2>{{ totalDoctors$ | async}}</h2>
        <button class="btn btn-primary mt-2" (click)="ViewDoctos()">View</button>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm p-3">
        <img src="../../assets/images/teamwork.png" alt="">
        <h5>Staff</h5>
        <h2>{{ totalStaff$ | async}}</h2>
        <button class="btn btn-primary mt-2" (click)="goToStaff()">Manage</button>
      </div>
    </div>
  </div>
</div>
