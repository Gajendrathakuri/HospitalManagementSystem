<div class="container">
  <div class="row d-flex justify-content-end">
    <button (click)="OpenModel()" class="btn w-25 rounded-1 btn-primary">
      <i class="bi bi-person-plus me-2"></i>
      New AppointMent
    </button>
  </div>
</div>

<div >
  <div class="div text-center">All Appointment Here</div>
  <app-tablecomponent [columns]="cols" [data]="AppointmentsData"> </app-tablecomponent>
</div>
<!-- Modal -->
<div class="modal fade modal-sm" id="appointmentModel" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Book Appointment</h5>

        <!-- Close Button -->
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-new-appointment></app-new-appointment>
      </div>
    </div>
  </div>
</div>
