<div class="container-fluid bg-body py-5 px-5 rounded-4">
  <div class="row">
    <div class="col-12 mx-auto">
      <h4 class="text-center">Register New Patient</h4>

      <form [formGroup]="form" (click)="submit()">
        <div class="row">
          <div class="col-4">
            <!-- fullname -->
            <!-- <div class="mt-3">
              <label for="name" class="form-label"
                >FullName <span class="text-danger">*</span></label
              >
              <input
                type="text"
                placeholder="Fullname"
                formControlName="name"
                class="form-control text-decoration-none"
              />
              @if (f['name'].invalid && (f['name'].touched || f['name'].dirty)) {
                <div class="text-danger">
                  @if (f['name'].errors?.['required']) {
                    <div>Name Field Is Required</div>
                  }
                </div>
              }
            </div> -->
            <!-- Name -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" formControlName="name" />
              <div
                class="text-danger"
                *ngIf="f['name'].invalid && (f['name'].touched || f['name'].dirty)"
              >
                <div *ngIf="f['name'].errors?.['required']">Name is required</div>
                <div *ngIf="f['name'].errors?.['minlength']">
                  Name must be greater than 3 characters
                </div>
              </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" formControlName="address" />
              <div
                class="text-danger"
                *ngIf="f['address'].invalid && (f['address'].touched || f['address'].dirty)"
              >
                <div *ngIf="f['address'].errors?.['required']">Address is required</div>
              </div>
            </div>

            <!-- age -->
            <div class="mt-3">
              <label for="age" class="form-label">Age <span class="text-danger"> *</span></label>
              <input
                type="text"
                id="age"
                placeholder="Age"
                class="form-control"
                formControlName="age"
                readonly
                [value]="currentAge"
              />
              <!-- <div *ngIf="form.get('age')?.invalid && form.get('age')?.touched" class="text-danger">Age is Required </div> -->
            </div>
          </div>
          <div class="col-3">
            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label">Phone No</label>
              <input type="text" class="form-control" formControlName="phoneNo" />
              <div
                class="text-danger"
                *ngIf="f['phoneNo'].invalid && (f['phoneNo'].touched || f['phoneNo'].dirty)"
              >
                <div *ngIf="f['phoneNo'].errors?.['required']">Phone number is required</div>
                <div *ngIf="f['phoneNo'].errors?.['pattern']">Phone must be exactly 10 digits</div>
              </div>
            </div>

            <!-- Gender -->
            <div class="mt-3">
              <label for="gender" class="form-label">Gender </label>
              <select class="form-select" id="gender" formControlName="gender">
                <option value="">Select Gender</option>
                <option [value]="0">Male</option>
                <option [value]="1">Female</option>
                <option [value]="2">Others</option>
              </select>
            </div>
            <!-- Citizenship No -->
            <div class="mt-3">
              <label for="ctno" class="form-label">CitizenShip No: </label>
              <input
                type="text"
                placeholder="CitizenShip No"
                id="ctno"
                formControlName="citizenshipNo"
                class="form-control"
              />
            </div>
          </div>
          <!-- dob -->

          <div class="col-4">
            <div class="mt-3">
              <label for="dob" class="form-label">Date of Birth</label>
              <input
                type="date"
                id="dob"
                placeholder="Date-of-birth"
                (change)="getAge(form.get('dateOfBirth')?.value)"
                class="form-control"
                formControlName="dateOfBirth"
              />
            </div>
            <!-- Regligion -->
            <div class="mt-3">
              <label for="religon" class="form-label">Religion</label>
              <select class="form-select" id="religion" formControlName="religion">
                <option value="">Religion</option>
                <option *ngFor="let religon of Religons" [value]="religon">
                  {{ religon }}
                </option>
              </select>
            </div>
            <!-- email -->
            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
              <div
                class="text-danger"
                *ngIf="f['email'].invalid && (f['email'].touched || f['email'].dirty)"
              >
                <div *ngIf="f['email'].errors?.['email']">Enter a valid email address</div>
              </div>
            </div>
          </div>
        </div>
        <div class="row d-flex align-items-center justify-content-center">
          <button type="submit" class="btn mt-3 btn-primary" style="width: 200px">Register</button>
        </div>
      </form>
    </div>
  </div>
</div>
