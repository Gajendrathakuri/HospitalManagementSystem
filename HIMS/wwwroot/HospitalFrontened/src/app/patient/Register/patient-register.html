<div class="container-fluid bg-body py-5 px-5 rounded-4">
  <div class="row">
    <div class="col-12 mx-auto">
      <h4 class="text-center">Register New Patient</h4>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row">
          <!-- LEFT SIDE -->
          <div class="col-4">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" formControlName="name" />
              <div class="text-danger" *ngIf="f['name'].invalid && (f['name'].touched || f['name'].dirty)">
                <div *ngIf="f['name'].errors?.['required']">Name is required</div>
                <div *ngIf="f['name'].errors?.['minlength']">Name must be at least 3 characters</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" formControlName="address" />
              <div class="text-danger" *ngIf="f['address'].invalid && (f['address'].touched || f['address'].dirty)">
                <div *ngIf="f['address'].errors?.['required']">Address is required</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Age</label>
              <input type="text" class="form-control" formControlName="age" readonly />
            </div>
          </div>

          <!-- MIDDLE SIDE -->
          <div class="col-3">
            <div class="mb-3">
              <label class="form-label">Phone No</label>
              <input type="text" class="form-control" formControlName="phoneNo" />
              <div class="text-danger" *ngIf="f['phoneNo'].invalid && (f['phoneNo'].touched || f['phoneNo'].dirty)">
                <div *ngIf="f['phoneNo'].errors?.['required']">Phone number is required</div>
                <div *ngIf="f['phoneNo'].errors?.['pattern']">Phone must be 10 digits</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select" formControlName="gender">
                <option value="">Select Gender</option>
                <option [value]="0">Male</option>
                <option [value]="1">Female</option>
                <option [value]="2">Others</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">CitizenShip No</label>
              <input type="text" class="form-control" formControlName="citizenshipNo" />
            </div>
          </div>

          <!-- RIGHT SIDE -->
          <div class="col-4">
            <div class="mb-3">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control" formControlName="dateOfBirth" (change)="getAge(form.get('dateOfBirth')?.value)" />
            </div>

            <div class="mb-3">
              <label class="form-label">Religion</label>
              <select class="form-select" formControlName="religion">
                <option value="">Select Religion</option>
                <option *ngFor="let religon of Religons" [value]="religon">{{ religon }}</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
              <div class="text-danger" *ngIf="f['email'].invalid && (f['email'].touched || f['email'].dirty)">
                <div *ngIf="f['email'].errors?.['email']">Enter a valid email address</div>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center mt-3">
          <button type="submit" class="btn btn-primary" style="width: 200px">Register</button>
        </div>
      </form>
    </div>
  </div>
</div>
