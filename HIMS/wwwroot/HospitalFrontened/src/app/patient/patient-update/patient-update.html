<div class="container">
    <div class="row">
        <form  [formGroup]="formdata" class="d-flex  gap-2"  >
        <div >
                <div>
                    <input type="text" formControlName="name"  class="form-control m-3" placeholder="FullName"  >
                </div>
                <!-- addre -->
                   <div>
                    <input type="text" class="form-control m-3" formControlName="address" placeholder="Address">
                </div>
                <!-- dob -->
                   <div>
                    <input type="date" class="form-control m-3" formControlName="dateofBirth" placeholder="Date of Birth">
                </div>
                <!-- gender -->
                <div class="mt-3">
            
              <select class="form-select m-3" >
                <option value="">Select Gender</option>

                <!-- <option *ngFor="let gender of GenderTypes" [value]="gender">
                  {{ gender }}
                </option> -->
              </select>
            </div>

            


        </div>
        <div >
                    <!-- contact no  -->
                        <div>
                    <input type="number" class="form-control m-3" formControlName="phoneNo" placeholder="Contact No">
                </div>
                    <!-- citizenship -->
                        <div>
                    <input type="text" class="form-control m-3" formControlName="citizenshipNo" placeholder="Citizenshipno">
                </div>
                  <div class="mt-3">
            
              <select  class="form-select m-3" >
                <option value="">Religion</option>

                <!-- <option *ngFor="let religon of Religions"  [value]="religon">
                  {{ religon }}
                </option> -->
              </select>
            </div>


            <!-- email -->
                <div>
                    <input type="email" formControlName="email" class="form-control m-3" placeholder="Email">
                </div>

        </div>
         
    </form>
    <div class="row d-flex justify-content-center">

  <button  type="button" (click)="submit()"  class="btn btn-primary w-25">
                        Save
                 </button>
    </div>
  
    </div>
</div>
